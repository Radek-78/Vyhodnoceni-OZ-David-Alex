<style>
    /* ── Import Module — Enhanced UI ──────────────────────────────
       Industrial Precision: tab switcher, tactile file trays,
       yellow drag glow, monospace data labels, left-accent config cards
    ─────────────────────────────────────────────────────────────── */

    /* Tab-bar mode switcher */
    .im-mode-grid {
        display: flex;
        gap: 3px;
        margin-bottom: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 3px;
    }

    .im-mode-card {
        flex: 1;
        padding: 8px 14px;
        background: transparent;
        border: none !important;
        border-radius: 7px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: background .15s, box-shadow .15s;
        box-shadow: none !important;
    }

    .im-mode-card:hover:not(.active) {
        background: rgba(3, 78, 171, .06);
        transform: none;
    }

    .im-mode-card.active {
        background: var(--blue) !important;
        box-shadow: 0 2px 8px rgba(3, 78, 171, .28) !important;
    }

    .im-mode-card.active .im-mode-title { color: #fff; }
    .im-mode-card.active .im-mode-sub   { color: rgba(255,255,255,.65); }

    .im-mode-icon {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        flex-shrink: 0;
        background: rgba(3, 78, 171, .09);
        transition: background .15s;
    }

    .im-mode-card.active .im-mode-icon {
        background: rgba(255, 255, 255, .15);
    }

    /* ── File slots ── */
    .im-slots {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
    }

    .im-slot {
        height: 110px;
        border: 2px dashed #d0d8e8;
        border-radius: 10px;
        background: #fcfcfd;
        background-image: repeating-linear-gradient(
            -45deg,
            transparent, transparent 7px,
            rgba(3, 78, 171, .016) 7px, rgba(3, 78, 171, .016) 8px
        );
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        transition: border-color .15s, background-color .15s, box-shadow .15s, transform .12s;
    }

    .im-slot:hover:not(.filled) {
        border-color: var(--blue-light);
        background-color: #f5f9ff;
    }

    .im-slot.drag {
        border-style: solid !important;
        border-color: var(--yellow) !important;
        background-color: rgba(255, 240, 1, .07) !important;
        background-image: none !important;
        box-shadow: 0 0 0 3px rgba(255, 240, 1, .35), inset 0 0 24px rgba(255, 240, 1, .05);
        transform: scale(1.025);
    }

    .im-slot.filled {
        border-style: solid;
        border-color: var(--blue);
        background: #eff6ff !important;
        background-image: none !important;
    }

    .im-slot.filled:hover {
        border-color: var(--blue-light);
        background: #e5efff !important;
    }

    /* File-type badge (top-left corner) */
    .im-slot-badge {
        position: absolute;
        bottom: 7px;
        left: 7px;
        background: var(--blue);
        color: #fff;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: .8px;
        padding: 2px 5px 1px;
        border-radius: 3px;
        font-family: var(--mono);
        text-transform: uppercase;
        line-height: 1.5;
    }

    .im-slot-badge.ext-csv  { background: #059669; }
    .im-slot-badge.ext-xls,
    .im-slot-badge.ext-xlsx { background: var(--blue); }

    /* Circular "+" ring in empty state */
    .im-slot-plus-ring {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid rgba(3, 78, 171, .22);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 300;
        color: rgba(3, 78, 171, .45);
        margin-bottom: 5px;
        transition: all .15s;
    }

    .im-slot:hover .im-slot-plus-ring {
        border-color: var(--blue);
        color: var(--blue);
        background: rgba(3, 78, 171, .07);
    }

    .im-upload-txt {
        font-size: 11px;
        font-weight: 700;
        color: var(--blue);
        display: block;
    }

    /* Format hint under upload label */
    .im-slot-hint {
        font-size: 9px;
        color: var(--t3);
        letter-spacing: .4px;
        margin-top: 3px;
        display: block;
        font-family: var(--mono);
        font-weight: 500;
    }

    /* Numbered step badge in top-left of slot */
    .im-slot-num {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--blue);
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font);
        line-height: 1;
        flex-shrink: 0;
    }

    .im-slot-icon { font-size: 26px; margin-bottom: 4px; }

    /* Label below icon in empty state */
    .im-slot-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--t1);
        margin-bottom: 3px;
        text-align: center;
    }

    /* "VYBRAT SOUBOR" link text */
    .im-slot-link {
        font-size: 9px;
        font-weight: 800;
        color: var(--blue);
        letter-spacing: .6px;
        text-transform: uppercase;
    }

    .im-slot-name {
        font-size: 10px;
        font-weight: 700;
        color: var(--blue-deep);
        white-space: normal;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        line-height: 1.25;
        max-width: 145px;
        max-height: 25px;
        margin-top: 3px;
        font-family: var(--mono);
        text-align: center;
        word-break: break-word;
    }

    .im-slot-remove {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 18px;
        height: 18px;
        background: var(--red);
        color: #fff;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 800;
        cursor: pointer;
        opacity: .65;
        transition: opacity .15s;
        z-index: 10;
    }

    .im-slot-remove:hover { opacity: 1; }

    /* Always-present sub-row — reserves height before file is loaded */
    .im-slot-sub {
        height: 28px;
        margin-top: 6px;
        display: flex;
        align-items: center;
    }

    .im-slot-sub .fg-input {
        padding: 4px 8px;
        font-size: 11px;
        height: 28px;
    }

    .im-slot-sheet-label {
        font-size: 10px;
        color: var(--t2);
        font-family: var(--mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        width: 100%;
        text-align: center;
    }

    /* Config cards with left accent stripe */
    .im-config-grid {
        display: grid;
        gap: 12px;
        margin-bottom: 14px;
    }

    .im-config-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 3px solid var(--blue);
        border-radius: 0 10px 10px 0;
        padding: 13px 14px;
    }

    .im-config-hd {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        padding-bottom: 7px;
        border-bottom: 1px solid #f0f2f5;
    }

    .im-config-icon { font-size: 14px; }

    .im-config-title {
        font-size: 10px;
        font-weight: 800;
        color: var(--t2);
        text-transform: uppercase;
        letter-spacing: .5px;
    }

    /* ── Toggle rows (import-scoped) ── */
    .im-tgl {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 7px 6px;
        border-radius: 7px;
        cursor: pointer;
        transition: background .12s;
        user-select: none;
    }

    .im-tgl + .im-tgl {
        border-top: 1px solid #f3f4f6;
    }

    .im-tgl:hover {
        background: rgba(3, 78, 171, .045);
    }

    .im-tgl-info {
        flex: 1;
        min-width: 0;
    }

    .im-tgl-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--t1);
        line-height: 1.3;
    }

    .im-tgl-desc {
        display: block;
        font-size: 10px;
        color: var(--t3);
        margin-top: 1px;
        line-height: 1.3;
    }

    /* Compact track inside toggle row */
    .im-tgl .tgl-track {
        width: 30px;
        height: 17px;
        border-radius: 9px;
        flex-shrink: 0;
    }

    .im-tgl .tgl-track::after {
        width: 13px;
        height: 13px;
    }

    .im-tgl .tgl-track.on::after {
        transform: translateX(13px);
    }

    /* Sheet count badge next to label */
    .im-sheet-count {
        font-size: 10px;
        font-weight: 500;
        color: var(--t3);
        font-family: var(--mono);
        margin-left: 4px;
    }
</style>

<script>
    /**
     * MODUL IMPORT — tři pevné importní moduly, vždy do aktivního sheetu.
     */
    (function () {
        var IMPORT_MODULES = [
            { key: 'cash', num: 1, icon: '💰', label: 'Pokladní data', accept: '.csv', hint: 'CSV', defaultSheet: 'Pokladni_data' },
            { key: 'mis', num: 2, icon: '📊', label: 'MIS prodej', accept: '.xlsx,.xls', hint: 'XLSX', defaultSheet: 'MIS prodej' },
            { key: 'fa', num: 3, icon: '📋', label: 'FA', accept: '.xlsx,.xls', hint: 'XLSX', defaultSheet: 'FA' }
        ];

        var CASH_COLUMNS = ['ITEMNR', 'DESCRIPTION', 'ITEMGROUP', 'ITEMCOUNT', 'KG', 'CZK', 'STORE'];
        var MIS_INTEGER_SOURCE_COLS = { 6: true, 7: true, 8: true, 10: true };
        var importRunning = false;

        if (!S._impSlots) {
            S._impSlots = IMPORT_MODULES.map(function (cfg) {
                return { targetSheet: cfg.defaultSheet, overwrite: true, sheetIdx: 0 };
            });
        }

        function imEnsureState() {
            IMPORT_MODULES.forEach(function (cfg, i) {
                if (!S._impSlots[i]) S._impSlots[i] = {};
                if (!S._impSlots[i].targetSheet) S._impSlots[i].targetSheet = cfg.defaultSheet;
                S._impSlots[i].overwrite = true;
                if (S._impSlots[i].sheetIdx === undefined) S._impSlots[i].sheetIdx = 0;
            });
        }

        window.vImport = function (m) {
            imEnsureState();
            var html = '<div class="im-slots">';

            IMPORT_MODULES.forEach(function (cfg, i) {
                var s = S._impSlots[i] || {};
                var ext = s.name ? s.name.split('.').pop().toLowerCase() : '';
                var statusCls = s.status === 'ok' ? ' ok' : (s.status === 'loading' ? ' loading' : '');

                html += '<div class="im-slot-wrap">';
                html += '<div class="im-slot' + (s.name ? ' filled' : '') + statusCls + '" id="dz' + i + '" ' +
                    'onclick="document.getElementById(\'fi' + i + '\').click()" ' +
                    'ondragover="imDrag(event, true, ' + i + ')" ' +
                    'ondragleave="imDrag(event, false, ' + i + ')" ' +
                    'ondrop="imDrop(event, ' + i + ')">';

                if (s.name) {
                    html += '<div class="im-slot-num">' + cfg.num + '</div>';
                    html += '<div class="im-slot-remove" onclick="event.stopPropagation(); imClearSlot(' + i + ')">×</div>';
                    html += '<div class="im-slot-badge ext-' + ext + '">' + esc(ext.toUpperCase()) + '</div>';
                    html += '<div class="im-slot-icon">📄</div>';
                    html += '<div class="im-slot-name">' + esc(s.name) + '</div>';
                } else {
                    html += '<div class="im-slot-num">' + cfg.num + '</div>';
                    html += '<div class="im-slot-icon">' + cfg.icon + '</div>';
                    html += '<div class="im-slot-label">' + esc(cfg.label) + '</div>';
                    html += '<div class="im-slot-link">Vybrat soubor</div>';
                    html += '<span class="im-slot-hint">' + esc(cfg.hint) + '</span>';
                }

                html += '<input type="file" id="fi' + i + '" accept="' + esc(cfg.accept) + '" hidden onchange="imHandleFile(this,' + i + ')">';
                html += '</div>';

                html += '<div class="im-config-card" style="margin-top:10px">';
                html += '<div class="im-config-hd"><span class="im-config-icon">' + cfg.icon + '</span><span class="im-config-title">' + esc(cfg.label) + '</span></div>';
                html += fg('Cílový list', '<input type="text" class="fg-input" id="fImpSheet' + i + '" value="' + esc(s.targetSheet || cfg.defaultSheet) + '" oninput="imSetTargetSheet(' + i + ', this.value)">');

                if (s.sheetNames && s.sheetNames.length > 1) {
                    html += '<div class="fg" style="margin-top:10px">' +
                        '<div class="fg-label">Zdrojový list v souboru</div>' +
                        '<select class="fg-input" onchange="imSetFileSheet(' + i + ', this.value)">' +
                        s.sheetNames.map(function (sn, idx) {
                            return '<option value="' + idx + '"' + (idx === s.sheetIdx ? ' selected' : '') + '>' + esc(sn) + '</option>';
                        }).join('') +
                        '</select>' +
                        '</div>';
                }

                html += '</div>';
                html += '</div>';
            });

            html += '</div>';
            m.innerHTML = '<div class="form" style="max-width:none">' + html + '</div>';

            var fBtns = document.getElementById('fBtns');
            if (fBtns) {
                fBtns.innerHTML = '<button class="btn btn-p" onclick="execImport()">📥 Spustit import</button>' +
                    '<button class="btn btn-s" onclick="go(\'home\')">Zrušit</button>';
            }
        };

        window.imClearSlot = function (i) {
            var cfg = IMPORT_MODULES[i];
            S._impSlots[i] = { targetSheet: cfg.defaultSheet, overwrite: true, sheetIdx: 0 };
            render();
        };
        window.imSetTargetSheet = function (i, value) {
            S._impSlots[i].targetSheet = value;
        };
        window.imDrag = function (e, over, i) {
            e.preventDefault();
            var el = document.getElementById('dz' + i);
            if (el) {
                if (over) el.classList.add('drag');
                else el.classList.remove('drag');
            }
        };
        window.imDrop = function (e, i) {
            e.preventDefault();
            var el = document.getElementById('dz' + i);
            if (el) el.classList.remove('drag');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) imProcessFile(e.dataTransfer.files[0], i);
        };
        window.imHandleFile = function (el, i) {
            if (el.files && el.files[0]) imProcessFile(el.files[0], i);
        };
        window.imSetFileSheet = function (slotIdx, sheetIdx) {
            S._impSlots[slotIdx].sheetIdx = parseInt(sheetIdx, 10);
        };
        async function imProcessFile(file, i) {
            var cfg = IMPORT_MODULES[i];
            var ext = file.name.split('.').pop().toLowerCase();
            var valid = cfg.key === 'cash' ? ext === 'csv' : (ext === 'xlsx' || ext === 'xls');
            if (!valid) {
                alert(cfg.label + ': očekávaný formát je ' + cfg.hint + '.');
                return;
            }

            S._impSlots[i] = Object.assign({}, S._impSlots[i], { file: file, name: file.name, status: 'loading' });
            AppLogger.info('Vybrán soubor pro ' + cfg.label + ': ' + file.name);
            render();

            try {
                if (cfg.key === 'cash' && ext === 'csv') {
                    S._impSlots[i].sheetNames = null;
                    S._impSlots[i].sheetIdx = 0;
                    S._impSlots[i].status = 'ok';
                    return;
                }

                var workbook = await readWorkbook(file);
                S._impSlots[i].sheetNames = workbook.SheetNames;
                S._impSlots[i].sheetIdx = 0;
                S._impSlots[i].status = 'ok';
            } catch (e) {
                S._impSlots[i].status = 'ok';
                console.error('Chyba při parsování struktury:', e);
                AppLogger.warn('Strukturu souboru se nepodařilo načíst předem: ' + file.name);
            } finally {
                render();
            }
        }

        var AppLogger = {
            log: function (m, l) { callServer('appLog_log', [m, l]); },
            info: function (m) { this.log(m, 'info'); },
            ok: function (m) { this.log(m, 'ok'); },
            warn: function (m) { this.log(m, 'warn'); },
            error: function (m) { this.log(m, 'error'); }
        };

        window.execImport = async function () {
            if (S.busy || importRunning) return;
            imEnsureState();
            var queue = S._impSlots
                .map(function (slot, idx) {
                    return Object.assign({}, slot, { moduleIndex: idx, moduleConfig: IMPORT_MODULES[idx] });
                })
                .filter(function (s) { return s.file; });
            if (queue.length === 0) { alert('Vyberte alespoň jeden soubor.'); return; }

            for (var q = 0; q < queue.length; q++) {
                queue[q].targetSheet = sanitizeSheetName(queue[q].targetSheet || queue[q].moduleConfig.defaultSheet);
                if (!queue[q].targetSheet) {
                    alert(queue[q].moduleConfig.label + ': zadejte název cílového listu.');
                    return;
                }
            }

            importRunning = true;
            var startTime = performance.now();
            AppLogger.info('🚀 Start importu: ' + queue.length + ' souborů.');
            setProgress(1, 'Start importu');

            setBusy(true);
            var completed = false;
            try {
                var result = await runSheetImport(queue, startTime);
                completed = true;
                setProgress(100, 'Import dokončen');
                showImportDone(result);
            } catch (err) {
                AppLogger.error('Import přerušen: ' + err.message);
                showResult('Chyba importu', 'Proces byl přerušen:<br>' + esc(err.message), '❌');
            } finally {
                importRunning = false;
                setBusy(false);
                if (completed) setTimeout(function () { setProgress(0, ''); }, 4000);
                else setProgress(0, '');
            }
        };

        async function runSheetImport(queue, startTime) {
            var formatHeader = true;
            var skipEmptyRows = true;
            var trimEmptyCols = false;
            var totalRows = 0;
            var perModule = [];

            for (var i = 0; i < queue.length; i++) {
                var slot = queue[i];
                var file = slot.file;
                var sourceSheetIdx = slot.sheetIdx || 0;
                var targetSheet = slot.targetSheet;
                var overwrite = slot.overwrite !== false;
                var nextStartRow = 1;
                var moduleBase = Math.round((i / queue.length) * 100);
                var moduleSpan = Math.max(1, Math.round(100 / queue.length));

                if (slot.moduleConfig.key === 'cash') {
                    var cashRows = await prepareCashRows(file, moduleBase, moduleSpan);
                    if (!cashRows.length) {
                        AppLogger.warn('Pokladní data: po filtraci nebyl nalezen žádný řádek pro aktivní artikly.');
                        perModule.push({
                            label: slot.moduleConfig.label,
                            sheet: targetSheet,
                            rows: 0,
                            fileName: file.name
                        });
                        continue;
                    }

                    var cashChunks = chunkRows(cashRows, 5000);
                    AppLogger.info('Pokladní data: zápis do listu "' + targetSheet + '" po ' + cashChunks.length + ' dávkách.');
                    for (var ci = 0; ci < cashChunks.length; ci++) {
                        updateImportProgress(moduleBase, moduleSpan, 30 + Math.round(((ci + 1) / cashChunks.length) * 70), 100,
                            'Zápis Pokladní data: dávka ' + (ci + 1) + '/' + cashChunks.length);
                        var cashRes = await callServer('moduleImport_cashChunk', [JSON.stringify(cashChunks[ci]), targetSheet, {
                            isFirstChunk: ci === 0,
                            overwrite: overwrite,
                            totalRows: cashRows.length,
                            startRow: ci === 0 ? undefined : (2 + ci * 5000)
                        }]);
                        if (!cashRes.success) throw new Error(cashRes.error);
                        AppLogger.ok('Pokladní data: zapsána dávka ' + (ci + 1) + '/' + cashChunks.length + ' (' + cashChunks[ci].length + ' řádků).');
                    }

                    totalRows += cashRows.length;
                    perModule.push({
                        label: slot.moduleConfig.label,
                        sheet: targetSheet,
                        rows: cashRows.length,
                        fileName: file.name
                    });
                    continue;
                }

                if (slot.moduleConfig.key === 'mis') {
                    var misRows = await prepareMisRows(file, targetSheet, sourceSheetIdx, moduleBase, moduleSpan);
                    if (!misRows.length) {
                        AppLogger.warn('MIS prodej: ve zdrojovém souboru nebyla nalezena žádná data pod hlavičkou.');
                        perModule.push({
                            label: slot.moduleConfig.label,
                            sheet: targetSheet,
                            rows: 0,
                            fileName: file.name
                        });
                        continue;
                    }

                    var misChunks = chunkRows(misRows, 5000);
                    AppLogger.info('MIS prodej: zápis do listu "' + targetSheet + '" po ' + misChunks.length + ' dávkách.');
                    for (var mi = 0; mi < misChunks.length; mi++) {
                        updateImportProgress(moduleBase, moduleSpan, 35 + Math.round(((mi + 1) / misChunks.length) * 65), 100,
                            'Zápis MIS prodej: dávka ' + (mi + 1) + '/' + misChunks.length);
                        var misRes = await callServer('moduleImport_misChunk', [JSON.stringify(misChunks[mi]), targetSheet, {
                            isFirstChunk: mi === 0,
                            overwrite: overwrite,
                            totalRows: misRows.length,
                            startRow: mi === 0 ? undefined : (2 + mi * 5000),
                            integerTargetIndexes: misRows.integerTargetIndexes || [],
                            dateTargetIndexes: misRows.dateTargetIndexes || []
                        }]);
                        if (!misRes.success) throw new Error(misRes.error);
                        AppLogger.ok('MIS prodej: zapsána dávka ' + (mi + 1) + '/' + misChunks.length + ' (' + misChunks[mi].length + ' řádků).');
                    }

                    totalRows += misRows.length;
                    perModule.push({
                        label: slot.moduleConfig.label,
                        sheet: targetSheet,
                        rows: misRows.length,
                        fileName: file.name
                    });
                    continue;
                }

                if (slot.moduleConfig.key === 'fa') {
                    var faRows = await prepareFaRows(file, targetSheet, sourceSheetIdx, moduleBase, moduleSpan);
                    if (!faRows.length) {
                        AppLogger.warn('FA: ve zdrojovém souboru nebyla nalezena žádná data pod hlavičkou.');
                        perModule.push({
                            label: slot.moduleConfig.label,
                            sheet: targetSheet,
                            rows: 0,
                            fileName: file.name
                        });
                        continue;
                    }

                    var faChunks = chunkRows(faRows, 5000);
                    AppLogger.info('FA: zápis do listu "' + targetSheet + '" po ' + faChunks.length + ' dávkách.');
                    for (var fi = 0; fi < faChunks.length; fi++) {
                        updateImportProgress(moduleBase, moduleSpan, 35 + Math.round(((fi + 1) / faChunks.length) * 65), 100,
                            'Zápis FA: dávka ' + (fi + 1) + '/' + faChunks.length);
                        var faRes = await callServer('moduleImport_faChunk', [JSON.stringify(faChunks[fi]), targetSheet, {
                            isFirstChunk: fi === 0,
                            overwrite: overwrite,
                            totalRows: faRows.length,
                            startRow: fi === 0 ? undefined : (2 + fi * 5000),
                            dateTargetIndexes: faRows.dateTargetIndexes || []
                        }]);
                        if (!faRes.success) throw new Error(faRes.error);
                        AppLogger.ok('FA: zapsána dávka ' + (fi + 1) + '/' + faChunks.length + ' (' + faChunks[fi].length + ' řádků).');
                    }

                    totalRows += faRows.length;
                    perModule.push({
                        label: slot.moduleConfig.label,
                        sheet: targetSheet,
                        rows: faRows.length,
                        fileName: file.name
                    });
                    continue;
                }

                AppLogger.info(slot.moduleConfig.label + ': čtu soubor ' + file.name);
                updateImportProgress(moduleBase, moduleSpan, 5, 100, 'Čtení: ' + slot.moduleConfig.label);
                var workbook = await readWorkbook(file);

                // Použijeme uživatelem vybraný list
                var sourceSheetName = workbook.SheetNames[sourceSheetIdx] || workbook.SheetNames[0];
                var rawData = XLSX.utils.sheet_to_json(workbook.Sheets[sourceSheetName], { header: 1, defval: "" });
                AppLogger.info(slot.moduleConfig.label + ': načten zdrojový list "' + sourceSheetName + '" (' + rawData.length + ' řádků).');
                updateImportProgress(moduleBase, moduleSpan, 20, 100, 'Příprava: ' + slot.moduleConfig.label);

                // Filtrování prázdných řádků (volitelné přes toggle)
                var data;
                if (skipEmptyRows) {
                    data = rawData.filter(function (row) {
                        if (!row || row.length === 0) return false;
                        return row.some(function (cell) {
                            return cell !== "" && cell !== null && cell !== undefined;
                        });
                    });
                } else {
                    data = rawData;
                }

                if (!data || data.length === 0) continue;
                AppLogger.info(slot.moduleConfig.label + ': po vyčištění zbývá ' + data.length + ' řádků.');

                var chunkSize = 5000;
                var chunks = [];
                for (var j = 0; j < data.length; j += chunkSize) {
                    chunks.push(data.slice(j, j + chunkSize));
                }

                // 1. Sekvenční start (kvůli inicializaci listu na serveru)
                var firstRaw = chunks.shift();
                var firstClean = cleanData(firstRaw);
                var res = await callServer('moduleImport_chunk', [JSON.stringify(firstClean), targetSheet, {
                    isFirstChunk: true,
                    overwrite: overwrite,
                    formatHeader: formatHeader,
                    startRow: undefined,
                    totalRows: data.length
                }]);

                if (!res.success) throw new Error(res.error);
                nextStartRow = res.actualStartRow + firstClean.length;
                totalRows += firstClean.length;
                updateImportProgress(moduleBase, moduleSpan, 40, 100, 'Zápis: ' + slot.moduleConfig.label);
                AppLogger.ok(slot.moduleConfig.label + ': zapsána první dávka (' + firstClean.length + ' řádků).');

                // 2. Bezpečná souběžnost (po 2 dávkách)
                var workerLimit = 2;
                for (var k = 0; k < chunks.length; k += workerLimit) {
                    var batch = chunks.slice(k, k + workerLimit);
                    var batchTasks = [];
                    for (var b = 0; b < batch.length; b++) {
                        var cData = cleanData(batch[b]);
                        batchTasks.push({ data: cData, row: nextStartRow });
                        nextStartRow += cData.length;
                        totalRows += cData.length;
                    }

                    updateImportProgress(moduleBase, moduleSpan, 40 + Math.round(((k + batch.length) / chunks.length) * 60), 100,
                        'Zápis: ' + slot.moduleConfig.label + ' (' + totalRows + ' řádků)');
                    var results = await Promise.all(batchTasks.map(t => callServer('moduleImport_chunk', [JSON.stringify(t.data), targetSheet, { isFirstChunk: false, startRow: t.row }])));
                    results.forEach(r => { if (!r.success) throw new Error(r.error); });
                    AppLogger.ok(slot.moduleConfig.label + ': zapsána dávka řádků, celkem zatím ' + totalRows + '.');
                }

                perModule.push({
                    label: slot.moduleConfig.label,
                    sheet: targetSheet,
                    rows: data.length,
                    fileName: file.name
                });
            }

            function cleanData(raw) {
                var cleaned = [];
                for (var r = 0; r < raw.length; r++) {
                    var row = raw[r];
                    if (!Array.isArray(row)) { cleaned.push([]); continue; }
                    var cRow = [];
                    for (var c = 0; c < row.length; c++) {
                        var v = row[c];
                        if (v && typeof v === 'object' && 'v' in v && !(v instanceof Date)) v = v.v;
                        if (v === undefined || v === null) cRow.push("");
                        else if (typeof v === 'string') {
                            cRow.push((v.indexOf('\x00') !== -1 || v.length > 500) ? v.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "").trim() : v);
                        } else if (typeof v === 'number' || typeof v === 'boolean' || v instanceof Date) {
                            cRow.push((typeof v === 'number' && !isFinite(v)) ? "" : v);
                        } else {
                            try { cRow.push(String(v).substring(0, 500)); } catch (e) { cRow.push(""); }
                        }
                    }
                    cleaned.push(cRow);
                }

                // Ořez koncových prázdných sloupců (pokud je zapnutý toggle)
                if (trimEmptyCols && cleaned.length > 0) {
                    var maxCol = 0;
                    for (var ri = 0; ri < cleaned.length; ri++) {
                        for (var ci = cleaned[ri].length - 1; ci >= 0; ci--) {
                            if (cleaned[ri][ci] !== "" && cleaned[ri][ci] !== null && cleaned[ri][ci] !== undefined) {
                                if (ci + 1 > maxCol) maxCol = ci + 1;
                                break;
                            }
                        }
                    }
                    if (maxCol > 0) {
                        cleaned = cleaned.map(function (row) { return row.slice(0, maxCol); });
                    }
                }

                return cleaned;
            }

            var endTime = performance.now();
            var dSec = (endTime - startTime) / 1000;
            var m = Math.floor(dSec / 60);
            var s = Math.floor(dSec % 60);
            var duration = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
            AppLogger.ok('🚀 Import dokončen za ' + duration + '.');

            S._impSlots = IMPORT_MODULES.map(function (cfg, idx) {
                return {
                    targetSheet: (S._impSlots[idx] && S._impSlots[idx].targetSheet) || cfg.defaultSheet,
                    overwrite: true,
                    sheetIdx: 0
                };
            });
            render();

            return { totalRows: totalRows, duration: duration, modules: perModule };
        }

        function updateImportProgress(base, span, current, total, label) {
            var pct = base + (span * (current / Math.max(total, 1)));
            setProgress(Math.max(1, Math.min(99, Math.round(pct))), label);
        }

        function showImportDone(result) {
            setTimeout(function () {
                var rows = result.modules.map(function (m) {
                    return '✅ ' + esc(m.label) + ' → <strong>' + esc(m.sheet) + '</strong> (' + esc(String(m.rows)) + ' řádků)';
                }).join('<br>');
                showResult('Import dokončen',
                    rows + '<br><br>Celkem: <strong>' + esc(String(result.totalRows)) + '</strong> řádků.<br>' +
                    'Čas: <strong>' + esc(result.duration) + '</strong>', '✅');
            }, 200);
        }

        function sanitizeSheetName(name) {
            return String(name || '').replace(/[:\\/?*\[\]]/g, '_').substring(0, 31).trim();
        }

        async function prepareCashRows(file, moduleBase, moduleSpan) {
            AppLogger.info('Pokladní data: načítám aktivní artikly z Vyhodnocení akce!A6:A28.');
            updateImportProgress(moduleBase, moduleSpan, 3, 100, 'Kontrola aktivních artiklů');
            var articleRes = await callServer('moduleImport_getActiveArticles', []);
            if (!articleRes.success) throw new Error(articleRes.error);

            var active = {};
            (articleRes.articles || []).forEach(function (id) { active[String(id).trim()] = true; });
            if (Object.keys(active).length === 0) {
                throw new Error('Na listu Vyhodnocení akce nejsou v buňkách A6:A28 žádné aktivní artikly.');
            }
            AppLogger.ok('Pokladní data: aktivních artiklů k filtrování: ' + Object.keys(active).length + '.');

            AppLogger.info('Pokladní data: čtu CSV soubor v kódování windows-1250: ' + file.name);
            updateImportProgress(moduleBase, moduleSpan, 8, 100, 'Čtení CSV');
            var workbook = await readWorkbook(file);
            var sheetName = workbook.SheetNames[0];
            var rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: '', raw: false });
            AppLogger.info('Pokladní data: načteno ' + rows.length + ' řádků ze zdrojového CSV.');
            updateImportProgress(moduleBase, moduleSpan, 18, 100, 'Filtrování CSV');

            var headerMap = null;
            var result = [];
            var repeatedHeaders = 0;
            var separators = 0;
            for (var r = 0; r < rows.length; r++) {
                var row = rows[r] || [];
                if (isCashHeaderRow(row)) {
                    headerMap = buildCashHeaderMap(row);
                    repeatedHeaders++;
                    continue;
                }
                if (isCashSeparatorRow(row)) {
                    separators++;
                    continue;
                }
                if (!headerMap) continue;

                var item = normalizeArticle(row[headerMap.ITEMNR]);
                if (!item || !active[item]) continue;

                result.push(CASH_COLUMNS.map(function (col) {
                    var value = row[headerMap[col]];
                    if (col === 'ITEMNR' || col === 'ITEMGROUP' || col === 'STORE') return normalizeArticle(value);
                    if (col === 'ITEMCOUNT' || col === 'KG' || col === 'CZK') return normalizeNumber(value);
                    return value === undefined || value === null ? '' : String(value).trim();
                }));
            }

            AppLogger.info('Pokladní data: přeskočeno hlaviček ' + repeatedHeaders + ', oddělovacích/prázdných řádků ' + separators + '.');
            AppLogger.ok('Pokladní data: po filtraci aktivních artiklů zbývá ' + result.length + ' řádků pro zápis.');
            updateImportProgress(moduleBase, moduleSpan, 30, 100, 'CSV připraveno k zápisu');

            return result;
        }

        async function prepareMisRows(file, targetSheet, sourceSheetIdx, moduleBase, moduleSpan) {
            AppLogger.info('MIS prodej: načítám cílové hlavičky z listu "' + targetSheet + '" v rozsahu B1:L1.');
            updateImportProgress(moduleBase, moduleSpan, 3, 100, 'Kontrola hlaviček MIS');
            var targetRes = await callServer('moduleImport_getMisTargetHeaders', [targetSheet]);

            var targetHeaders = targetRes.headers || [];

            AppLogger.info('MIS prodej: cílové sloupce B:L načteny (' + targetHeaders.length + ' sloupců).');

            AppLogger.info('MIS prodej: čtu XLSX soubor ' + file.name + '.');

                throw new Error('MIS prodej: ve zdrojové hlavičce chybí sloupce: ' + mapping.missing.join(', '));

                    if (sourceIdx === null || sourceIdx === undefined) return '';
                    var value = sourceRow[sourceIdx];
                    return cleanMisCellValue(value, sourceIdx, targetHeaders[targetIdx]);
                }));
            }

            result.integerTargetIndexes = mapping.integerTargetIndexes;
            result.dateTargetIndexes = mapping.dateTargetIndexes;
            AppLogger.ok('MIS prodej: připraveno ' + result.length + ' řádků pro zápis od řádku 2.');

            return result;
        }

        async function prepareFaRows(file, targetSheet, sourceSheetIdx, moduleBase, moduleSpan) {
            AppLogger.info('FA: načítám cílové hlavičky z listu "' + targetSheet + '" v rozsahu D1:J1.');
            updateImportProgress(moduleBase, moduleSpan, 3, 100, 'Kontrola hlaviček FA');
            var targetRes = await callServer('moduleImport_getFaTargetHeaders', [targetSheet]);
            if (!targetRes.success) throw new Error(targetRes.error);

            var targetHeaders = targetRes.headers || [];
            if (!targetHeaders.length) throw new Error('FA: cílový list nemá v rozsahu D1:J1 žádné hlavičky.');
            AppLogger.info('FA: cílové sloupce D:J načteny (' + targetHeaders.length + ' sloupců).');

            AppLogger.info('FA: čtu XLSX soubor ' + file.name + '.');
            updateImportProgress(moduleBase, moduleSpan, 8, 100, 'Čtení XLSX');
            var workbook = await readWorkbook(file);
            var sourceSheetName = workbook.SheetNames[sourceSheetIdx] || workbook.SheetNames[0];
            var rows = XLSX.utils.sheet_to_json(workbook.Sheets[sourceSheetName], { header: 1, defval: '', raw: false });
            AppLogger.info('FA: načten zdrojový list "' + sourceSheetName + '" (' + rows.length + ' řádků).');

            if (mapping.missing.length) {
                throw new Error('FA: ve zdrojové hlavičce chybí sloupce: ' + mapping.missing.join(', '));
            }

                    return cleanFaCellValue(value, targetHeaders[targetIdx]);
                }));

            AppLogger.ok('FA: připraveno ' + result.length + ' řádků pro zápis od řádku 2.');
            updateImportProgress(moduleBase, moduleSpan, 35, 100, 'FA připraveno k zápisu');
            return result;
        }

        function findMisHeaderRow(rows, targetHeaders) {
            var requiredScore = getMisRequiredHeaderCount(targetHeaders);
            var expectedIdx = 6;
            if (rows[expectedIdx]) {
                var expectedScore = scoreMisHeaderRow(rows[expectedIdx], targetHeaders);
                if (expectedScore >= requiredScore) {
                    return { index: expectedIdx, row: rows[expectedIdx], score: expectedScore };
                }
            }

            var best = null;
            for (var r = 0; r < rows.length; r++) {
                var score = scoreMisHeaderRow(rows[r] || [], targetHeaders);
                if (!best || score > best.score) {
                    best = { index: r, row: rows[r] || [], score: score };
                }
            }
            return best && best.score > 0 ? best : null;
        }

        function getMisRequiredHeaderCount(targetHeaders) {
            return targetHeaders.filter(function (header) {
                return String(header || '').trim() !== '';
            }).length;
        }

        function findFaHeaderRow(rows, targetHeaders) {
            var requiredScore = getMisRequiredHeaderCount(targetHeaders);
            var expectedIdx = 2;
            if (rows[expectedIdx]) {
                var expectedScore = scoreFaHeaderRow(rows[expectedIdx], targetHeaders);
                if (expectedScore >= requiredScore) {
                    return { index: expectedIdx, row: rows[expectedIdx], score: expectedScore };
                }
            }

            var best = null;
            for (var r = 0; r < rows.length; r++) {
                var score = scoreFaHeaderRow(rows[r] || [], targetHeaders);
                if (!best || score > best.score) {
                    best = { index: r, row: rows[r] || [], score: score };
                }
            }
            return best && best.score > 0 ? best : null;
        }

        function scoreFaHeaderRow(sourceHeader, targetHeaders) {
            var score = 0;
            targetHeaders.forEach(function (header) {
                if (!String(header || '').trim()) return;
                if (findFaSourceColumn(sourceHeader, header) !== -1) score++;
            });
            return score;
        }

        function buildFaColumnMapping(sourceHeader, targetHeaders) {
            var columns = [];
            var missing = [];
            var mappedCount = 0;
            var dateTargetIndexes = [];

            for (var i = 0; i < targetHeaders.length; i++) {
                var header = String(targetHeaders[i] || '').trim();
                if (!header) {
                    var prevHeader = String(targetHeaders[i - 1] || '').trim();
                    var prevSourceIdx = isFaPairedHeader(prevHeader) ? findFaSourceColumn(sourceHeader, prevHeader) : -1;
                    if (prevSourceIdx !== -1) {
                        columns.push(prevSourceIdx + 1);
                        mappedCount++;
                    } else {
                        columns.push(null);
                    }
                    continue;
                }

                var sourceIdx = findFaSourceColumn(sourceHeader, header);
                if (sourceIdx === -1) {
                    missing.push(header);
                    columns.push(null);
                } else {
                    columns.push(sourceIdx);
                    mappedCount++;
                    if (normalizeHeader(header) === normalizeHeader('Entrydate')) dateTargetIndexes.push(i);
                }
            }

            return {
                columns: columns,
                missing: missing,
                mappedCount: mappedCount,
                dateTargetIndexes: dateTargetIndexes
            };
        }

        function findFaSourceColumn(sourceHeader, targetHeader) {
            var target = normalizeHeader(targetHeader);
            var pairedHeader = isFaPairedHeader(targetHeader);
            var fallback = -1;

            for (var i = 0; i < sourceHeader.length; i++) {
                var source = normalizeHeader(sourceHeader[i]);
                if (!source) continue;
                if (source === target) return i;
                if (pairedHeader && getFaPairedKey(sourceHeader[i]) === getFaPairedKey(targetHeader)) fallback = i;
            }

            return fallback;
        }

        function isFaPairedHeader(header) {
            return getFaPairedKey(header) !== '';
        }

        function getFaPairedKey(header) {
            var normalized = normalizeHeader(header);
            if (normalized === normalizeHeader('Item')) return 'item';
            if (normalized === normalizeHeader('Warehouse')) return 'warehouse';
            return '';
        }

        function scoreMisHeaderRow(sourceHeader, targetHeaders) {
            var score = 0;
            targetHeaders.forEach(function (header) {
                if (!String(header || '').trim()) return;
                if (findMisSourceColumn(sourceHeader, header) !== -1) score++;
            });
            return score;
        }

        function buildMisColumnMapping(sourceHeader, targetHeaders) {
            var columns = [];
            var missing = [];
            var mappedCount = 0;
            var integerTargetIndexes = [];
            var dateTargetIndexes = [];

            for (var i = 0; i < targetHeaders.length; i++) {
                var header = String(targetHeaders[i] || '').trim();
                if (!header) {
                    var prevHeader = String(targetHeaders[i - 1] || '').trim();
                    var prevIsSpecial = isMisSpecialHeader(prevHeader);
                    var prevSourceIdx = prevIsSpecial ? findMisSourceColumn(sourceHeader, prevHeader) : -1;
                    if (prevSourceIdx !== -1) {
                        columns.push(prevSourceIdx + 1);
                        mappedCount++;
                        if (MIS_INTEGER_SOURCE_COLS[prevSourceIdx + 1]) integerTargetIndexes.push(i);
                    } else {
                        columns.push(null);
                    }
                    continue;
                }

                var sourceIdx = findMisSourceColumn(sourceHeader, header);
                if (sourceIdx === -1) {
                    missing.push(header);
                    columns.push(null);
                } else {
                    columns.push(sourceIdx);
                    mappedCount++;
                    if (MIS_INTEGER_SOURCE_COLS[sourceIdx]) integerTargetIndexes.push(i);
                    if (normalizeHeader(header) === normalizeHeader('Den T01')) dateTargetIndexes.push(i);
                }
            }

            return {
                columns: columns,
                missing: missing,
                mappedCount: mappedCount,
                integerTargetIndexes: integerTargetIndexes,
                dateTargetIndexes: dateTargetIndexes
            };
        }

        function findMisSourceColumn(sourceHeader, targetHeader) {
            var target = normalizeHeader(targetHeader);
            var specialKey = getMisSpecialKey(targetHeader);
            var fallback = -1;

            for (var i = 0; i < sourceHeader.length; i++) {
                var source = normalizeHeader(sourceHeader[i]);
                if (!source) continue;
                if (source === target) return i;
                if (specialKey && getMisSpecialKey(sourceHeader[i]) === specialKey) fallback = i;
            }

            return fallback;
        }

        function isMisSpecialHeader(header) {
            return getMisSpecialKey(header) !== '';
        }

        function getMisSpecialKey(header) {
            var normalized = normalizeHeader(header);
            if (normalized.indexOf('sklad o05') !== -1) return 'sklad_o05';
            if (normalized.indexOf('artikly |02') !== -1 || normalized.indexOf('artikl |02') !== -1) return 'artikl_02';
            return '';
        }

        function normalizeHeader(value) {
            return String(value || '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLocaleLowerCase('cs-CZ');
        }

        function rowHasValue(row) {
            return row.some(function (cell) {
                return cell !== '' && cell !== null && cell !== undefined;
            });
        }

        function cleanMisCellValue(value, sourceIdx, targetHeader) {
            var cleaned = cleanCellValue(value);
            if (normalizeHeader(targetHeader) === normalizeHeader('Den T01')) {
                return formatMisDate(cleaned);
            }
            if (MIS_INTEGER_SOURCE_COLS[sourceIdx]) {
                return normalizeMisInteger(cleaned);
            }
            return cleaned;
        }

        function cleanFaCellValue(value, targetHeader) {
            var cleaned = cleanCellValue(value);
            if (normalizeHeader(targetHeader) === normalizeHeader('Entrydate')) {
                return formatMisDate(cleaned);
            }
            return cleaned;
        }

        function cleanCellValue(value) {
            if (value && typeof value === 'object' && 'v' in value && !(value instanceof Date)) value = value.v;
            if (value === undefined || value === null) return '';
            if (typeof value === 'string') return value.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '').replace(/^'/, '').trim();
            if (typeof value === 'number' && !isFinite(value)) return '';
            return value;
        }

        function formatMisDate(value) {
            if (value === undefined || value === null || value === '') return '';
            if (value instanceof Date && !isNaN(value.getTime())) {
                return value.getDate() + '.' + (value.getMonth() + 1) + '.' + value.getFullYear();
            }

            var text = String(value).trim();
            var cz = text.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})$/);
            if (cz) {
                var first = Number(cz[1]);
                var second = Number(cz[2]);
                var year = normalizeMisYear(cz[3]);
                if (second > 12 && first <= 12) return second + '.' + first + '.' + year;
                return first + '.' + second + '.' + year;
            }

            var iso = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (iso) return Number(iso[3]) + '.' + Number(iso[2]) + '.' + iso[1];

            return text.replace(/\//g, '.');
        }

        function normalizeMisYear(year) {
            var text = String(year || '').trim();
            if (text.length === 2) return '20' + text;
            return text;
        }

        function normalizeMisInteger(value) {
            if (value === undefined || value === null || value === '') return '';
            if (typeof value === 'number') return isFinite(value) ? Math.round(value) : '';

            var text = String(value).trim();
            if (!text) return '';
            var normalized = text.replace(/[\s\u00A0\u202F,]/g, '');
            if (/^-?\d+$/.test(normalized)) return Number(normalized);
            return text;
        }

        function isCashHeaderRow(row) {
            var seen = {};
            row.forEach(function (cell) {
                var key = String(cell || '').trim().toUpperCase();
                if (key) seen[key] = true;
            });
            return CASH_COLUMNS.every(function (col) { return seen[col]; });
        }

        function buildCashHeaderMap(row) {
            var map = {};
            row.forEach(function (cell, idx) {
                var key = String(cell || '').trim().toUpperCase();
                if (CASH_COLUMNS.indexOf(key) !== -1) map[key] = idx;
            });
            return map;
        }

        function isCashSeparatorRow(row) {
            var nonEmpty = row.filter(function (cell) { return String(cell || '').trim() !== ''; });
            if (!nonEmpty.length) return true;
            return nonEmpty.every(function (cell) { return /^-+$/.test(String(cell || '').trim()); });
        }

        function normalizeArticle(value) {
            if (value === undefined || value === null) return '';
            var text = String(value).trim();
            if (/^\d+(\.0+)?$/.test(text)) text = String(parseInt(text, 10));
            return text;
        }

        function normalizeNumber(value) {
            if (value === undefined || value === null || value === '') return '';
            var text = String(value).trim().replace(/\s/g, '').replace(',', '.');
            var num = Number(text);
            return isNaN(num) ? text : num;
        }

        function chunkRows(rows, size) {
            var chunks = [];
            for (var i = 0; i < rows.length; i += size) chunks.push(rows.slice(i, i + size));
            return chunks;
        }

        function readWorkbook(file) {
            return new Promise(function (resolve, reject) {
                var r = new FileReader();
                var ext = file.name.split('.').pop().toLowerCase();
                r.onload = function (e) {
                    try {
                        if (ext === 'csv') {
                            resolve(XLSX.read(e.target.result, { type: 'string', cellDates: true }));
                        } else {
                            var d = new Uint8Array(e.target.result);
                            resolve(XLSX.read(d, { type: 'array', cellDates: true, dateNF: 'd.m.yyyy' }));
                        }
                    } catch (ex) {
                        reject(ex);
                    }
                };
                r.onerror = reject;
                if (ext === 'csv') r.readAsText(file, 'windows-1250');
                else r.readAsArrayBuffer(file);
            });
        }
        function callServer(f, a) { return new Promise((resolve, reject) => { google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[f].apply(this, a); }); }
        function render() { var m = document.getElementById('main'); if (S.mod === 'import') vImport(m); }
    })();
</script>
